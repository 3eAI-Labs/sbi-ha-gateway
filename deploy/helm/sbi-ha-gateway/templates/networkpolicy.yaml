{{- if .Values.networkPolicy.enabled }}
# Ingress to the gateway pods (values.yaml, networkPolicy): the SBI port from sbiFrom, or from
# anywhere when it is empty; the admin port, which has no authentication, only from pods in
# this namespace and from adminFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sbi-ha-gateway.fullname" . }}
  labels:
    {{- include "sbi-ha-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sbi-ha-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: sbi
          protocol: TCP
      {{- with .Values.networkPolicy.sbiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: admin
          protocol: TCP
      from:
        - podSelector: {}
        {{- with .Values.networkPolicy.adminFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
