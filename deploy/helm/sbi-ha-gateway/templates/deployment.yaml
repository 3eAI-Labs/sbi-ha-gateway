{{- if and .Values.config.ota.enabled (include "sbi-ha-gateway.natsBundled" .) -}}
{{- fail "config.ota.enabled needs config.nats.url: the SMS stream OTA_OUTBOUND is on the applications' NATS, and the bundled NATS has no JetStream." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbi-ha-gateway.fullname" . }}
  labels:
    {{- include "sbi-ha-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sbi-ha-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "sbi-ha-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sbi-ha-gateway.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $stopMs := add (include "sbi-ha-gateway.ms" .Values.config.shutdown.drainDelay | int64) (include "sbi-ha-gateway.ms" .Values.config.shutdown.timeout | int64) }}
      {{- if ge $stopMs (mul .Values.terminationGracePeriodSeconds 1000) }}
      {{- fail (printf "config.shutdown.drainDelay (%s) plus config.shutdown.timeout (%s) must stay below terminationGracePeriodSeconds (%v s), or the kubelet kills the gateway while it finishes its work" .Values.config.shutdown.drainDelay .Values.config.shutdown.timeout .Values.terminationGracePeriodSeconds) }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /*
        Secure by default. A trial install — the bundled NATS, config.nats.url
        empty — switches off what it lacks, explicitly, so that the chart's defaults start. Any
        other install must provide each protection or switch it off itself.
      */}}
      {{- $trial := include "sbi-ha-gateway.natsBundled" . }}
      {{- $plaintext := not .Values.tls.existingSecret }}
      {{- if and .Values.config.admin.tls $plaintext (not $trial) }}
      {{- fail "config.nats.url is set, so this is not a trial install: the admin port is served with the SBI certificate (tls.existingSecret), or config.admin.tls=false" }}
      {{- end }}
      {{- if and $plaintext (not $trial) (not .Values.config.security.allowPlaintextSbi) }}
      {{- fail "config.nats.url is set, so this is not a trial install: the SBI port needs TLS (tls.existingSecret), or config.security.allowPlaintextSbi=true" }}
      {{- end }}
      {{- $mode := .Values.config.mtls.clientAuthMode }}
      {{- if and (ne $mode "off") (or $plaintext (not .Values.config.mtls.clientCAFile)) }}
      {{- if $trial }}{{- $mode = "off" }}{{- else }}
      {{- fail (printf "config.mtls.clientAuthMode=%s needs tls.existingSecret with ca.crt and config.mtls.clientCAFile, or clientAuthMode off" $mode) }}
      {{- end }}
      {{- end }}
      {{- $oauthOff := .Values.config.oauth.disabled }}
      {{- if and (not $oauthOff) (or (not .Values.config.oauth.audience) (and (not .Values.config.oauth.nrfJwksUrl) (not .Values.config.oauth.jwksFile))) }}
      {{- if $trial }}{{- $oauthOff = true }}{{- else }}
      {{- fail "config.oauth needs audience and nrfJwksUrl (or jwksFile), or config.oauth.disabled=true" }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: sbi
              containerPort: {{ .Values.config.server.sbiPort | int }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.config.server.adminPort | int }}
              protocol: TCP
          env:
            # Server
            - name: SBI_PORT
              value: {{ .Values.config.server.sbiPort | quote }}
            - name: ADMIN_PORT
              value: {{ .Values.config.server.adminPort | quote }}
            {{- if .Values.config.admin.auth }}
            - name: ADMIN_TOKEN_FILE
              value: {{ printf "/etc/sbi-gateway/admin/%s" .Values.config.admin.tokenKey | quote }}
            {{- else }}
            - name: ADMIN_AUTH_DISABLED
              value: "true"
            {{- end }}
            - name: ADMIN_TLS
              value: {{ include "sbi-ha-gateway.adminTLS" . | eq "true" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # NATS: config.nats.url, or the bundled NATS when it is empty
            - name: NATS_URL
              value: {{ include "sbi-ha-gateway.natsURL" . | quote }}
            - name: NATS_CONNECT_TIMEOUT
              value: {{ .Values.config.nats.connectTimeout | quote }}
            - name: NATS_REQUEST_TIMEOUT
              value: {{ .Values.config.nats.requestTimeout | quote }}
            {{- with .Values.config.nats.secret }}
            {{- if .name }}
            # NATS credentials and TLS — files from config.nats.secret
            {{- if .user }}
            - name: NATS_USER
              value: {{ .user | quote }}
            {{- end }}
            {{- range $env, $key := dict "NATS_PASSWORD_FILE" .passwordKey "NATS_TOKEN_FILE" .tokenKey "NATS_CREDS_FILE" .credsKey "NATS_NKEY_SEED_FILE" .nkeySeedKey "NATS_TLS_CA_FILE" .caKey "NATS_TLS_CERT_FILE" .certKey "NATS_TLS_KEY_FILE" .keyKey }}
            {{- if $key }}
            - name: {{ $env }}
              value: {{ printf "/etc/sbi-gateway/nats/%s" $key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            # Retry
            - name: MAX_RETRIES
              value: {{ .Values.config.retry.maxRetries | quote }}
            - name: RETRY_BASE_DELAY
              value: {{ .Values.config.retry.baseDelay | quote }}
            - name: NOTIFY_WORKERS
              value: {{ .Values.config.notify.workers | quote }}
            # Shutdown
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.config.shutdown.drainDelay | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.config.shutdown.timeout | quote }}
            # Rate limiting
            - name: RATE_LIMIT_RPS
              value: {{ .Values.config.rateLimit.rps | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.config.rateLimit.burst | quote }}
            # Protections: explicit opt-outs only (see above)
            - name: ALLOW_PLAINTEXT_SBI
              value: {{ $plaintext | quote }}
            - name: MTLS_CLIENT_AUTH_MODE
              value: {{ $mode | quote }}
            # OAuth2 NF tokens
            - name: OAUTH_DISABLED
              value: {{ $oauthOff | quote }}
            - name: OAUTH_AUDIENCE
              value: {{ .Values.config.oauth.audience | quote }}
            - name: OAUTH_NRF_JWKS_URL
              value: {{ .Values.config.oauth.nrfJwksUrl | quote }}
            - name: OAUTH_JWKS_FILE
              value: {{ .Values.config.oauth.jwksFile | quote }}
            - name: OAUTH_JWKS_REFRESH
              value: {{ .Values.config.oauth.jwksRefresh | quote }}
            - name: OAUTH_CLOCK_SKEW
              value: {{ .Values.config.oauth.clockSkew | quote }}
            - name: OAUTH_RESULT_CACHE_TTL
              value: {{ .Values.config.oauth.resultCacheTTL | quote }}
            - name: OAUTH_REQUIRE_CERT_BINDING
              value: {{ .Values.config.oauth.requireCertBinding | quote }}
            # Outbound / OTA / Audit
            - name: OUTBOUND_PROFILE
              value: {{ .Values.config.outbound.profile | quote }}
            - name: OUTBOUND_ALLOWED_DESTINATIONS
              value: {{ join "," .Values.config.outbound.allowedDestinations | quote }}
            - name: OUTBOUND_ALLOW_ANY
              value: {{ .Values.config.outbound.allowAny | quote }}
            {{- with .Values.config.mtls }}
            {{- range $env, $path := dict "MTLS_OUTBOUND_CERT_FILE" .outboundCertFile "MTLS_OUTBOUND_KEY_FILE" .outboundKeyFile "MTLS_OUTBOUND_CA_FILE" .outboundCAFile }}
            {{- if $path }}
            - name: {{ $env }}
              value: {{ $path | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: OTA_ENABLED
              value: {{ .Values.config.ota.enabled | quote }}
            - name: OTA_RESOLVER_FILE
              value: {{ .Values.config.ota.resolverFile | quote }}
            - name: OTA_UECM_TIMEOUT
              value: {{ .Values.config.ota.uecmTimeout | quote }}
            - name: AUDIT_DISABLED
              value: {{ .Values.config.audit.disabled | quote }}
            - name: AUDIT_NATS_SUBJECT
              value: {{ .Values.config.audit.natsSubject | quote }}
            {{- if .Values.tls.existingSecret }}
            # TLS/mTLS — cert material mounted from tls.existingSecret
            - name: TLS_CERT_FILE
              value: "{{ .Values.tls.mountPath }}/tls.crt"
            - name: TLS_KEY_FILE
              value: "{{ .Values.tls.mountPath }}/tls.key"
            {{- if .Values.config.mtls.clientCAFile }}
            - name: MTLS_CLIENT_CA_FILE
              value: "{{ .Values.tls.mountPath }}/ca.crt"
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: admin
              scheme: {{ ternary "HTTPS" "HTTP" (include "sbi-ha-gateway.adminTLS" . | eq "true") }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
              scheme: {{ ternary "HTTPS" "HTTP" (include "sbi-ha-gateway.adminTLS" . | eq "true") }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tls.existingSecret .Values.config.nats.secret.name .Values.config.admin.auth .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.nats.secret.name }}
            - name: nats-secret
              mountPath: /etc/sbi-gateway/nats
              readOnly: true
            {{- end }}
            {{- if .Values.config.admin.auth }}
            - name: admin-token
              mountPath: /etc/sbi-gateway/admin
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tls.existingSecret .Values.config.nats.secret.name .Values.config.admin.auth .Values.extraVolumes }}
      volumes:
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.config.nats.secret.name }}
        - name: nats-secret
          secret:
            secretName: {{ .Values.config.nats.secret.name }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.config.admin.auth }}
        - name: admin-token
          secret:
            secretName: {{ include "sbi-ha-gateway.adminTokenSecret" . }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
