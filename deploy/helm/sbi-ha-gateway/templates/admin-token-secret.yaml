{{- if and .Values.config.admin.auth (not .Values.config.admin.tokenSecret) }}
{{- /*
The admin port's bearer token when none is given: random, kept across upgrades (lookup reads
the existing Secret). Where lookup cannot (helm template, GitOps renderers) a new one is made:
the gateway reads its token file again every 10 s, and Prometheus reads the Secret per scrape.
*/}}
{{- $name := include "sbi-ha-gateway.adminTokenSecret" . }}
{{- $key := .Values.config.admin.tokenKey }}
{{- $existing := (get (lookup "v1" "Secret" .Release.Namespace $name | default dict) "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sbi-ha-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ get $existing $key | default (randAlphaNum 48 | b64enc) }}
{{- end }}
