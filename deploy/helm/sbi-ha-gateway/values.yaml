# Default values for sbi-ha-gateway.
# 5G SBI HA Gateway — 3GPP HTTP/2 (Nudm/Nudr) ↔ NATS bridge. Stateless; horizontal scaling.

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  # Allowlisted registry (Contract §8.1 — no scheme, private IP or localhost).
  registry: ghcr.io
  repository: 3eai-labs/sbi-ha-gateway
  # Overrides the image tag; defaults to the chart appVersion when empty. Never "latest".
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

# PSA `restricted`: non-root, RuntimeDefault seccomp, no privilege escalation, all
# capabilities dropped. 65532 is the distroless image's nonroot user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Secret volumes are owned by root: fsGroup makes them group 65532, readable at 0440.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  sbiPort: 80        # external port → targetPort SBI (config.server.sbiPort)
  adminPort: 9090    # metrics + health

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

# Longer than config.shutdown.drainDelay plus the 5 s shutdown, or the kubelet kills the gateway
# with requests in flight.
terminationGracePeriodSeconds: 30

# -- Application configuration (rendered to env; mirrors internal/config/config.go) --
config:
  server:
    sbiPort: "8080"
    adminPort: "9090"

  # The admin port: /metrics, /health/live, /health/ready, /admin/stats. Protected by default,
  # like the SBI port; the health endpoints stay open for the kubelet.
  # - auth: /metrics and /admin/* require the bearer token in tokenSecret's tokenKey. Without a
  #   tokenSecret the chart creates <fullname>-admin-token with a random token; the
  #   ServiceMonitor (metrics.serviceMonitor) uses it. false is an explicit opt-out.
  # - tls: the port is served with tls.existingSecret's certificate; the probes use HTTPS.
  #   false is an explicit opt-out; a trial install without TLS switches it off itself.
  admin:
    auth: true
    tokenSecret: ""
    tokenKey: "token"
    tls: true
  logLevel: info            # debug | info | warn | error

  nats:
    # The NATS your applications use. Empty: the chart deploys its own NATS (see nats: below),
    # for a trial install only — no application is connected to it.
    url: ""
    connectTimeout: "5s"
    requestTimeout: "2s"
    # Credentials and TLS for that NATS, from a Secret you provide, mounted read-only at
    # /etc/sbi-gateway/nats. Name the keys the Secret holds and leave the others empty: one
    # authentication (user and password, token, user credentials or nkey seed), and TLS with a
    # CA and optionally a client certificate. Never put credentials in url: the pod spec shows it.
    secret:
      name: ""
      user: ""          # with passwordKey
      passwordKey: ""
      tokenKey: ""
      credsKey: ""      # user JWT and nkey seed (.creds)
      nkeySeedKey: ""
      caKey: ""         # CA of the NATS server's certificate: TLS
      certKey: ""       # client certificate, with keyKey
      keyKey: ""

  retry:
    maxRetries: 3
    baseDelay: "1s"

  # Notifications delivered at once: one whose network function does not answer holds one.
  notify:
    workers: 32

  # After SIGTERM the gateway goes on serving for drainDelay, /health/ready answering 503, so that
  # connections kube-proxy still sends to the terminating pod are answered. Then, within timeout,
  # the requests in flight, the notification deliveries and the SMS being sent finish. The two
  # together must stay below terminationGracePeriodSeconds; the chart refuses to render otherwise.
  shutdown:
    drainDelay: "5s"
    timeout: "20s"

  # Per-client token bucket in front of the back end. rps=0 disables the limiter.
  rateLimit:
    rps: 0
    burst: 100

  # Secure by default: the SBI port needs TLS (tls.existingSecret), client certificates
  # (config.mtls) and OAuth (config.oauth) — or each one's explicit opt-out below and there.
  # A trial install (config.nats.url empty: the bundled NATS) opts out of what it lacks, so
  # that the chart's defaults start; with config.nats.url set, a missing protection stops
  # the render with what to set.
  security:
    allowPlaintextSbi: false   # true: cleartext h2c without tls.existingSecret

  # TLS/mTLS (TS 33.310). Cert material is mounted from tls.existingSecret (never inline).
  tls:
    certFile: ""
    keyFile: ""
  mtls:
    clientCAFile: ""
    clientAuthMode: "require"   # off | optional | require; require needs clientCAFile
    # Outbound TLS for callbacks and SMSF calls: file paths, mounted with extraVolumes. The CA
    # alone is TLS without a client certificate; a certificate needs its key and the CA.
    outboundCertFile: ""
    outboundKeyFile: ""
    outboundCAFile: ""

  # OAuth2 NF tokens (TS 33.501 §13.4.1): required — set audience and nrfJwksUrl (or
  # jwksFile), or disabled: true.
  oauth:
    disabled: false
    audience: ""
    nrfJwksUrl: ""
    jwksFile: ""
    jwksRefresh: "5m"
    clockSkew: "30s"
    resultCacheTTL: "60s"
    requireCertBinding: false

  # Registration with the NRF (TS 29.510 Nnrf_NFManagement); off while apiRoot is empty. The
  # installation is one NF instance per profile, whatever replicaCount: every pod registers the
  # same profile and heartbeats it, and a stopping pod does not deregister, since the others
  # serve on. The NRF is called over HTTP/2 with the outbound TLS files (config.mtls).
  nrf:
    apiRoot: ""          # the NRF's {apiRoot}, e.g. https://nrf.5gc.mnc001.mcc001.3gppnetwork.org
    heartbeatTimer: ""   # interval to propose, whole seconds ("30s"); empty: the NRF's
    # The {apiRoot} the NRF reaches the SBI port at, through the Service, e.g.
    # https://sbi-gw.5gc.svc.cluster.local:8443 (with TLS, a name the SBI certificate holds).
    # Set, each pod subscribes to the SMSFs it discovers (NFStatusSubscribe), and their
    # deregistration or profile change makes it ask the NRF again at the next SMS rather than
    # at the end of the validityPeriod. Needs the SMS_GMSC profile. Empty: no subscription.
    notificationApiRoot: ""
    # One entry per NF type, UDM and/or UDR, and SMS_GMSC. "profile" is a TS 29.510 NFProfile:
    # nfInstanceId (a lower-case UUID v4, also listed in config.oauth.audience), nfType, an
    # address (fqdn; with TLS it must be an FQDN), and plmnList, udmInfo/udrInfo, priority, ...
    # as needed. The SMS_GMSC profile (with config.sms.enabled) registers no service: it is
    # the instance MT SMS goes to the SMSF as: an SMSF named by instance ID is discovered as it,
    # and the access tokens an SMSF asks for are its own. Give it no "service", and leave it out
    # of config.oauth.audience.
    # "service" holds NFService attributes added to each service registered, such as
    # ipEndPoints. With TLS, consumers that build the URI from the fqdn use port 443: serve the
    # SBI there (service.sbiPort), or give ipEndPoints the address with the port; some NRFs drop
    # an entry with only a port (Open5GS 2.7.6, measured).
    # The gateway adds nfStatus, heartBeatTimer and its services (nudm-* for the UDM, nudr-dr
    # for the UDR), with their versions, scheme and oauth2Required.
    #   - profile:
    #       nfInstanceId: 4947a69a-f61b-4bc1-b9da-47c9c5d14b64
    #       nfType: UDM
    #       fqdn: udm.5gc.mnc001.mcc001.3gppnetwork.org
    #       plmnList: [{mcc: "001", mnc: "01"}]
    #       udmInfo: {groupId: udm-1}
    #     service:
    #       allowedNfTypes: [AMF, AUSF, SMF, SMSF]
    profiles: []
    # On helm uninstall a post-delete Job deletes the profiles from the NRF, once no pod
    # heartbeats them: it deletes, waits a heartbeat interval and deletes again until nothing
    # is left. It fails the uninstall if the NRF cannot be reached within timeoutSeconds;
    # `helm uninstall --no-hooks` skips it, and the NRF then suspends the instance when the
    # heartbeats stop. Keep timeoutSeconds within helm's --timeout (default 5m).
    deregister:
      enabled: true
      timeoutSeconds: 290

  # Delivery of data-change notifications: sbi_direct | scef_rest.
  outbound:
    profile: "sbi_direct"
    # Hosts callbacks and SMSF calls may reach: host names, ".domain" suffixes, CIDR blocks,
    # addresses. Checked on the address actually dialled. Empty: none. Loopback, link-local
    # (cloud metadata) and multicast addresses only when listed by address.
    allowedDestinations: []
    allowAny: false   # true: any host but those always refused

  # SMS surfaces: serving-SMSF lookup and Nsmsf MtForwardSm. Off until opted in; needs
  # config.nats.url, a NATS with JetStream (the bundled one has none). The gateway consumes the
  # stream that captures sbi.outbound.nsmsf.send.request, whatever its name, and creates one
  # named `stream` (a work queue, one replica) when none does: create it beforehand to choose
  # its replicas and limits. Each SMS's result goes to deliveryEventSubject.
  sms:
    enabled: false
    resolverFile: ""
    uecmTimeout: "3s"
    stream: "SBI_SMSF_SEND"
    deliveryEventSubject: "sbi.nsmsf.delivery.event"

  # Audit of state-changing operations. Subject may be tenant-prefixed for multi-tenant clusters.
  audit:
    disabled: false
    natsSubject: "audit.events"

# Further volumes for files the gateway reads by path — the outbound TLS files, a JWKS file
# (config.oauth.jwksFile), the SMS resolver (config.sms.resolverFile) — usually a Secret or a
# ConfigMap, mounted read-only.
extraVolumes: []
extraVolumeMounts: []

# Ingress to the gateway pods. The SBI port is reachable from sbiFrom (empty: anywhere); the
# admin port (metrics, health, stats; its token and TLS: config.admin) only from pods in the
# release's namespace and from adminFrom (add your Prometheus here). Kubelet probes are not
# peers of a NetworkPolicy on common CNIs (verified on kind's kindnet).
networkPolicy:
  enabled: true
  sbiFrom: []
  adminFrom: []

# -- TLS secret (operator-provisioned; mounted at /etc/sbi-gateway/tls when set) --
tls:
  # Name of a pre-created Secret holding tls.crt / tls.key / ca.crt. Empty ⇒ h2c.
  existingSecret: ""
  mountPath: /etc/sbi-gateway/tls

# Bundled NATS, used only when config.nats.url is empty: a single-replica, core-only NATS
# (no JetStream, no storage) so that an install with the chart's defaults starts and becomes
# Ready, for a trial or a smoke test. NOT for production: there the
# gateway must reach the applications' NATS, so set config.nats.url to it. With a URL set,
# nothing below is deployed. With nats.deploy=false and no URL the chart refuses to render.
nats:
  deploy: true
  image: docker.io/library/nats:2.10-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Prometheus Operator resources; their CRDs must be installed. Prometheus must reach the admin
# port: add its namespace to networkPolicy.adminFrom.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}      # e.g. release: kube-prometheus-stack, for the operator's selector
    tlsConfig: {}   # with admin TLS (the default): e.g. {insecureSkipVerify: true}, or the SBI CA
  prometheusRule:
    enabled: false
    labels: {}
    errorRatio: 0.05            # share of 5xx SBI answers that alerts
    certificateExpiryDays: 14   # alert this long before a certificate expires
