name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — use
        [private vulnerability reporting](https://github.com/3eAI-Labs/sbi-ha-gateway/security/advisories/new)
        instead. Do not paste real subscriber identities (SUPI, SUCI, GPSI, MSISDN), access tokens or
        operator NF identities.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Nudm_UEAU
        - Nudm_UECM
        - Nudm_SDM / PP / EE
        - Nudm_MT
        - Nudr_DR
        - OAuth2 / mTLS
        - Rate limiting
        - NATS bridge
        - Notification delivery (callbacks)
        - SMS surfaces (serving-SMSF lookup, SendSMS)
        - Admin port / metrics
        - Helm chart
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Gateway version
      description: Container image tag or commit.
    validations:
      required: true

  - type: input
    id: peer
    attributes:
      label: Network function on the other side
      description: The AMF / AUSF / SMF / SMSF / other NF calling the gateway (or called by it), vendor and version if known.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        A failing test, or the exact HTTP request and response (method, path, status, body) and NATS
        messages, is the fastest route to a fix.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The relevant environment variables or Helm values. Remove credentials.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
