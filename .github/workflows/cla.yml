# Contributor licence agreement gate.
#
# Runs in the PUBLIC mirror (3eAI-Labs/sbi-ha-gateway), which is where issues and pull requests
# are handled; the job is skipped in private repositories, so the internal source repository
# carries this file without running it. The document it points at is CLA.md in the public mirror.
#
# Signatures are stored in a SEPARATE repository, not in this one: this repository is re-published
# as a single squashed snapshot per release, so any file the bot committed between releases would
# be destroyed by the next publish. sbi-ha-gateway and sbi-ha-gateway-client share one
# signature file, so a contributor accepts once for both.
#
# Two things must exist before this workflow can work, and both are repository settings rather
# than code:
#   1. a repository 3eAI-Labs/cla-signatures (may be private) to hold the signature file;
#   2. a PERSONAL_ACCESS_TOKEN secret in this repository, which is what lets the action write to
#      that other repository. Use a FINE-GRAINED token scoped to cla-signatures alone, with
#      Contents: read and write — nothing else.
# Until both are in place every pull request check fails — a hard gate, not a soft warning.
#
# The action is pinned by commit SHA to v2.6.1, its final release (the repository was archived by
# its maintainer in 2025). Same pin and same reasoning as 3eAI-Labs/bpm-channels.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read        # 'read' is enough: signatures live in another repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Check contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the commit SHA, not the tag: a tag is mutable, and this step runs on
        # pull_request_target with a token that can write to another repository.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/3eAI-Labs/sbi-ha-gateway/blob/main/CLA.md'
          path-to-signatures: 'signatures/sbi-ha-gateway/v1.json'
          remote-organization-name: '3eAI-Labs'
          remote-repository-name: 'cla-signatures'
          branch: 'main'
          # No allowlist, deliberately. The action (v2.6.1, src/setupClaCheck.ts) applies the
          # allowlist BEFORE it sets aside commits that are not linked to a GitHub account, and
          # names such a commit by its git author name (src/graphql.ts), which whoever makes the
          # commit chooses. Any allowlisted name — an exact login as much as a pattern, and its
          # pattern match is unanchored — can therefore be claimed by an outside contributor to
          # skip the agreement. Release snapshots are pushed, not proposed as pull requests, so
          # maintainers do not need an exemption; a bot pull request fails this check by design.
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged, please read the
            [3eAI Labs Contributor Licence Agreement](https://github.com/3eAI-Labs/sbi-ha-gateway/blob/main/CLA.md)
            and accept it by posting the sentence below as a comment on this pull request. You keep
            the copyright in what you write; section 2 explains what you are granting. You only do
            this once, and it covers sbi-ha-gateway-client as well.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have accepted the CLA. Thank you.'
